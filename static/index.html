<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zambia Treasury Insight — USD/ZMW</title>
<script src="/static/vendor/plotly.min.js"></script>
<style>
:root {
  --bg: #ffffff; --page: #f6f7f9; --surface: #ffffff;
  --ink: #0f172a; --ink2: #475569; --muted: #64748b;
  --grid: #e2e8f0; --axis: #cbd5e1;
  --s1: #0f766e; --s2: #2563eb; --s3: #d97706; --s4: #64748b; --s5: #7c3aed; --s6: #0891b2;
  --weak: #dc2626; --strong: #2563eb; --warn: #d97706; --warnbg: #fffbeb; --crit: #dc2626;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme=light]) {
  --bg: #0b0f17; --page: #0b0f17; --surface: #111827;
  --ink: #e5e7eb; --ink2: #9ca3af; --muted: #6b7280;
  --grid: #1f2937; --axis: #374151; --warnbg: #2a1d06;
  --s1: #2dd4bf; --s2: #60a5fa; --s3: #fbbf24; --s4: #9ca3af; --s5: #a78bfa; --s6: #22d3ee;
  --weak: #f87171; --strong: #60a5fa; --crit: #f87171;
}}
:root[data-theme=dark] {
  --bg: #0b0f17; --page: #0b0f17; --surface: #111827;
  --ink: #e5e7eb; --ink2: #9ca3af; --muted: #6b7280;
  --grid: #1f2937; --axis: #374151; --warnbg: #2a1d06;
  --s1: #2dd4bf; --s2: #60a5fa; --s3: #fbbf24; --s4: #9ca3af; --s5: #a78bfa; --s6: #22d3ee;
  --weak: #f87171; --strong: #60a5fa; --crit: #f87171;
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--page); color: var(--ink); }
header { background: var(--surface); border-bottom: 1px solid var(--grid); padding: 12px 24px 0; position: sticky; top: 0; z-index: 10; }
.top { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 18px; font-weight: 700; }
.sub { color: var(--muted); font-size: 12px; }
.spacer { flex: 1; }
nav { display: flex; gap: 2px; margin-top: 10px; overflow-x: auto; }
nav button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 14px; font: inherit; color: var(--ink2); cursor: pointer; white-space: nowrap; }
nav button.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--s1); }
main { max-width: 1200px; margin: 0 auto; padding: 20px 24px 60px; }
.banner { display: flex; gap: 10px; align-items: baseline; padding: 10px 14px; border: 1px solid var(--warn); background: var(--warnbg); border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
.banner b { color: var(--warn); }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); margin-bottom: 18px; }
.card { background: var(--surface); border: 1px solid var(--grid); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
.card h2 { margin: 0 0 6px; font-size: 15px; }
.hint { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
.stat { background: var(--surface); border: 1px solid var(--grid); border-radius: 10px; padding: 12px 14px; }
.stat .n { color: var(--ink2); font-size: 12px; }
.stat .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 2px 0; }
.stat .d { font-size: 12px; color: var(--ink2); display: flex; gap: 10px; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
button.btn, select, input { font: 13px/1.3 inherit; color: var(--ink); }
.btn { background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--ink2); }
.btn.sel { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.primary { background: var(--s1); color: #fff; border-color: var(--s1); }
.row label { color: var(--ink2); font-size: 13px; }
input, select { background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; padding: 6px 8px; }
input[type=number] { width: 110px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--ink2); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.chart { width: 100%; height: 380px; }
.chart.short { height: 280px; }
.two { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
@media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
.story li { margin-bottom: 6px; }
.sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:7px; }
.tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--axis); color: var(--ink2); }
.tag.demo { border-color: var(--warn); color: var(--ink); background: var(--warnbg); }
.tag.bad { border-color: var(--crit); color: var(--crit); }
.verdict { border: 1px solid var(--grid); padding: 10px 14px; background: var(--page); border-radius: 8px; margin: 10px 0; }
.big { font-size: 32px; font-weight: 700; }
.err { color: var(--crit); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink2); margin: 4px 0 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.hidden { display: none; }
.evlist { display: flex; gap: 6px; flex-wrap: wrap; }
.evlist button { font-size: 12px; padding: 3px 9px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Zambia Treasury Insight</h1>
    <span class="sub">Live USD/ZMW, Bank of Zambia rates, copper &amp; macro decision support.</span>
    <span class="spacer"></span>
    <button class="btn" id="theme" title="Toggle light / dark">Theme</button>
  </div>
  <nav id="nav">
    <button data-tab="overview" class="on">Overview</button>
    <button data-tab="explain">What happened &amp; why</button>
    <button data-tab="history">Drivers through history</button>
    <button data-tab="forecast">Forecast</button>
    <button data-tab="scenario">Scenarios</button>
    <button data-tab="data">Data &amp; quality</button>
    <button data-tab="manual">User manual</button>
  </nav>
</header>
<main>
  <div id="banner"></div>
  <section id="tab-overview"></section>
  <section id="tab-explain" class="hidden"></section>
  <section id="tab-history" class="hidden"></section>
  <section id="tab-forecast" class="hidden"></section>
  <section id="tab-scenario" class="hidden"></section>
  <section id="tab-data" class="hidden"></section>
  <section id="tab-manual" class="hidden"></section>
</main>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = (x, d = 2) => (x === null || x === undefined || isNaN(x)) ? '–' : Number(x).toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d});
const sgn = (x, d = 1) => (x === null || x === undefined || isNaN(x)) ? '–' : (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(d);
const state = { tab: 'overview', range: '3Y', compare: '', cat: 'all', freq: 'W-FRI', exTarget: 'USDZMW', fcTarget: 'USDZMW', fcH: 12, fcModel: 'auto', status: null, lastDate: null, rendered: {} };

async function api(path, opts) {
  const r = await fetch(path, opts);
  let body = null; try { body = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((body && (body.detail || body.message)) || r.statusText);
  return body;
}
function showErr(el, e) { el.innerHTML = `<p class="err"><b>Could not load:</b> ${esc(e.message)}</p>`; }

function layout(extra = {}) {
  return Object.assign({
    paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
    font: { family: 'system-ui, -apple-system, Segoe UI, sans-serif', size: 12, color: css('--ink2') },
    margin: { l: 56, r: 16, t: 10, b: 36 },
    xaxis: { gridcolor: css('--grid'), linecolor: css('--axis'), zeroline: false },
    yaxis: { gridcolor: css('--grid'), linecolor: css('--axis'), zeroline: false },
    hovermode: 'x unified', showlegend: false,
  }, extra);
}
const cfg = { displaylogo: false, responsive: true, modeBarButtonsToRemove: ['lasso2d', 'select2d'] };

$('#theme').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = cur === 'dark' ? 'light' : 'dark';
  state.rendered = {}; show(state.tab);
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { state.rendered = {}; show(state.tab); });
$('#nav').onclick = e => { const b = e.target.closest('button'); if (b) show(b.dataset.tab); };

function show(tab) {
  state.tab = tab;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  document.querySelectorAll('main > section').forEach(s => s.classList.toggle('hidden', s.id !== 'tab-' + tab));
  if (!state.rendered[tab]) { state.rendered[tab] = true; ({overview, explain, history: historyTab, forecast, scenario, data: dataTab, manual})[tab](); }
}

async function boot() {
  try {
    const s = await api('/api/status'); state.status = s;
    const b = $('#banner');
    const noFx = !s.series.some(x => x.series_id === 'USDZMW');
    if (noFx) {
      const r = s.refresh || {};
      const running = !!r.running;
      b.innerHTML = `<div class="banner"><b>${running ? 'Loading live data' : 'No exchange-rate data yet'}</b><span>${running
        ? 'Fetching Bank of Zambia, FRED and Yahoo market feeds.'
        : 'Use Data &amp; quality below to sync live feeds or upload Bank of Zambia rates.'}</span></div>`;
      show('data');
      if (running) setTimeout(() => location.reload(), 6000);
      return;
    }
    if (s.mode !== 'live') b.innerHTML = `<div class="banner"><b>DEMO DATA</b><span>Values are synthetic until live feeds finish loading.</span></div>`;
    const stale = s.series.filter(x => x.stale && !x.is_demo);
    if (stale.length) b.innerHTML += `<div class="banner"><b>Stale series</b><span>${stale.map(x => esc(x.series_id) + ' (' + x.age_days + 'd old)').join(', ')}</span></div>`;
  } catch (e) { showErr($('#banner'), e); }
  show('overview');
}

/* ---------- overview ---------- */
async function overview() {
  const el = $('#tab-overview');
  el.innerHTML = '<p class="hint">Loading…</p>';
  try {
    const [ov, ev, sig] = await Promise.all([api('/api/overview'), api('/api/events'), api('/api/treasury-signals').catch(() => null)]);
    state.lastDate = ov.cards.find(c => c.series_id === 'USDZMW')?.date;
    const filteredCards = ov.cards.filter(c => state.cat === 'all' || (c.category || 'macro') === state.cat);
    const cards = filteredCards.map(c => {
      const u = c.kind === 'rate' ? 'pp' : '%';
      const dd = (l, v) => `<span>${l} ${sgn(v, c.kind === 'rate' ? 2 : 1)}${v == null ? '' : u}</span>`;
      return `<div class="stat"><div class="n">${esc(c.name)}</div><div class="v">${fmt(c.last, c.last > 1000 ? 0 : 2)}</div>
        <div class="d">${dd('1w', c.chg_1w)}${dd('4w', c.chg_4w)}${dd('52w', c.chg_52w)}</div>
        <div class="d"><span>${esc(c.unit)} · ${c.date}</span></div></div>`;
    }).join('');
    const catBar = `<div class="row" style="margin-bottom:10px"><label>Market Watchlist</label>${[['all','All Markets'],['fx','FX Pairs'],['rates','Zambia Rates & CPI'],['macro','Copper & Global']].map(([k,l])=>`<button class="btn ${state.cat===k?'sel':''}" data-cat="${k}">${l}</button>`).join('')}</div>`;
    const sigCard = sig ? `<div class="card"><h2>Treasury &amp; FX Decision Guidance — ${esc(sig.bias_label)} (${sig.counts.appreciation} Appreciation · ${sig.counts.neutral} Neutral · ${sig.counts.depreciation} Depreciation)</h2>
      <p class="hint">${esc(sig.summary)}</p>
      <table><tr><th>Macro / Market Pillar</th><th>Signal</th><th>Reading</th><th>Watch Trigger</th></tr>
      ${sig.signals.map(s => `<tr><td><b>${esc(s.pillar)}</b><br><span class="sub">${esc(s.detail)}</span></td><td style="color:${s.stance==='depreciation'?'var(--weak)':s.stance==='appreciation'?'var(--strong)':'var(--ink2)'};font-weight:600">${esc(s.stance_label)}</td><td>${esc(s.reading)}</td><td><span class="sub">${esc(s.watch_trigger)}</span></td></tr>`).join('')}</table>
      <div class="grid" style="margin-top:12px;margin-bottom:0">${sig.playbooks.map(p => `<div class="stat"><div class="n"><b>${esc(p.audience)}</b></div><div style="font-size:13px;font-weight:600;margin:4px 0">${esc(p.posture)}</div><ul class="story" style="padding-left:16px;margin:6px 0 0;font-size:12px">${p.steps.map(st=>`<li>${esc(st)}</li>`).join('')}</ul></div>`).join('')}</div></div>` : '';
    const ip = ov.interpretation;
    const interpCard = ip ? `<div class="card"><h2>Trend &amp; Volatility Monitor</h2>
      <p class="hint">${esc(ip.trend_label)}${ip.ma12w ? ` · 12w MA ${fmt(ip.ma12w)}` : ''}${ip.ma26w ? ` · 26w MA ${fmt(ip.ma26w)}` : ''}${ip.vol12w_ann_pct ? ` · 12w Ann. Vol ${fmt(ip.vol12w_ann_pct, 1)}%` : ''}</p>
      <ul class="story">${ip.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul></div>` : '';
    const opts = ov.cards.filter(c => c.series_id !== 'USDZMW').map(c => `<option value="${c.series_id}" ${state.compare === c.series_id ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
    el.innerHTML = `${catBar}<div class="grid">${cards}</div>${sigCard}${interpCard}
      <div class="card"><h2>USD/ZMW with key events</h2>
      <p class="hint">Higher = weaker kwacha. Hover event markers or compare against Copper, USD/ZAR, SA Equity (EZA), or Global USD (DXY) rebased to 100.</p>
      <div class="row">${['1Y','3Y','5Y','10Y','ALL'].map(r => `<button class="btn ${state.range === r ? 'sel' : ''}" data-r="${r}">${r}</button>`).join('')}
        <label>Compare with</label><select id="cmp"><option value="">— none —</option>${opts}</select></div>
      <div class="legend" id="ov-legend"></div>
      <div id="ov-chart" class="chart"></div></div>`;
    el.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { state.cat = b.dataset.cat; state.rendered.overview = false; show('overview'); });
    el.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { state.range = b.dataset.r; state.rendered.overview = false; show('overview'); });
    $('#cmp').onchange = e => { state.compare = e.target.value; drawOverview(ev.events); };
    drawOverview(ev.events);
  } catch (e) { showErr(el, e); }
}
async function drawOverview(events) {
  const yrs = { '1Y': 1, '3Y': 3, '5Y': 5, '10Y': 10 }[state.range];
  let start = null;
  if (yrs) { const d = new Date(state.lastDate || Date.now()); d.setFullYear(d.getFullYear() - yrs); start = d.toISOString().slice(0, 10); }
  const ids = ['USDZMW'].concat(state.compare ? [state.compare] : []).join(',');
  const s = await api(`/api/series?ids=${ids}${start ? '&start=' + start : ''}`);
  const fx = s.USDZMW; if (!fx) return;
  const traces = [];
  const rebase = !!state.compare && s[state.compare];
  if (rebase) {
    const b0 = fx.values[0], c0 = s[state.compare].values[0];
    traces.push({ x: fx.dates, y: fx.values.map(v => v / b0 * 100), type: 'scatter', mode: 'lines', name: 'USD/ZMW (=100)', line: { color: css('--s1'), width: 2 } });
    traces.push({ x: s[state.compare].dates, y: s[state.compare].values.map(v => v / c0 * 100), type: 'scatter', mode: 'lines', name: s[state.compare].name, line: { color: css('--s2'), width: 2 } });
    $('#ov-legend').innerHTML = `<span><i style="background:var(--s1)"></i>USD/ZMW</span><span><i style="background:var(--s2)"></i>${esc(s[state.compare].name)}</span>`;
  } else {
    traces.push({ x: fx.dates, y: fx.values, type: 'scatter', mode: 'lines', name: 'USD/ZMW', line: { color: css('--s1'), width: 2 } });
    $('#ov-legend').innerHTML = '';
  }
  const inRange = events.filter(e => e.date >= fx.dates[0] && e.date <= fx.dates[fx.dates.length - 1]);
  const ref = traces[0];
  const near = d => { let lo = 0, hi = ref.x.length - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (ref.x[m] < d) lo = m + 1; else hi = m; } return ref.y[lo]; };
  if (inRange.length) traces.push({ x: inRange.map(e => e.date), y: inRange.map(e => near(e.date)), mode: 'markers', type: 'scatter', name: 'Events',
    marker: { size: 10, color: css('--surface'), line: { color: css('--ink'), width: 2 } }, text: inRange.map(e => `<b>${esc(e.title)}</b><br>${esc(e.category)}`),
    hovertemplate: '%{text}<extra></extra>' });
  Plotly.react('ov-chart', traces, layout({ yaxis: { gridcolor: css('--grid'), linecolor: css('--axis'), title: rebase ? 'Index (start = 100)' : 'ZMW per USD', zeroline: false } }), cfg);
}

/* ---------- explain ---------- */
async function explain() {
  const el = $('#tab-explain');
  const ev = (await api('/api/events')).events;
  const end = state.lastDate || new Date().toISOString().slice(0, 10);
  const d0 = new Date(end); d0.setDate(d0.getDate() - 182);
  el.innerHTML = `<div class="card"><h2>Historical Driver Attribution</h2>
    <p class="hint">Dynamic Newey-West HAC regression combining contemporaneous shocks, 1-period lagged external transmission, and long-run fair-value reversion.</p>
    <div class="row"><label>Target</label><select id="ex-tg"><option value="USDZMW" ${state.exTarget==='USDZMW'?'selected':''}>Kwacha (USD/ZMW)</option><option value="ON_INTERBANK" ${state.exTarget==='ON_INTERBANK'?'selected':''}>Interbank Yield (%)</option><option value="CPI_YOY" ${state.exTarget==='CPI_YOY'?'selected':''}>Inflation (CPI YoY %)</option></select>
      <label>From</label><input type="date" id="ex-s" value="${d0.toISOString().slice(0, 10)}"><label>To</label><input type="date" id="ex-e" value="${end}">
      <label>Frequency</label><select id="ex-fq"><option value="W-FRI" ${state.freq==='W-FRI'?'selected':''}>Weekly</option><option value="ME" ${state.freq==='ME'?'selected':''}>Monthly (incl. CPI &amp; SA yields)</option></select>
      <button class="btn primary" id="ex-go">Explain</button>
      <button class="btn" data-m="3">3m</button><button class="btn" data-m="6">6m</button><button class="btn" data-m="12">12m</button><button class="btn" data-m="36">3y</button></div>
    <div class="row"><label>Jump to an event (±13 weeks):</label></div>
    <div class="evlist">${ev.slice(-14).map(e => `<button class="btn" data-ev="${esc(e.date)}" title="${esc(e.title)}">${esc(e.date)} · ${esc(e.title.slice(0, 36))}</button>`).join('') || '<span class="hint">No events loaded.</span>'}</div></div>
    <div id="ex-out"></div>`;
  $('#ex-go').onclick = runExplain;
  $('#ex-tg').onchange = e => { state.exTarget = e.target.value; if (state.exTarget === 'CPI_YOY') { state.freq = 'ME'; $('#ex-fq').value = 'ME'; } runExplain(); };
  $('#ex-fq').onchange = e => { state.freq = e.target.value; runExplain(); };
  el.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const e = new Date($('#ex-e').value); e.setMonth(e.getMonth() - +b.dataset.m); $('#ex-s').value = e.toISOString().slice(0, 10); runExplain(); });
  el.querySelectorAll('[data-ev]').forEach(b => b.onclick = () => {
    const d = new Date(b.dataset.ev), a = new Date(d), z = new Date(d); a.setDate(a.getDate() - 91); z.setDate(z.getDate() + 91);
    $('#ex-s').value = a.toISOString().slice(0, 10); $('#ex-e').value = z.toISOString().slice(0, 10); runExplain();
  });
  runExplain();
}
async function runExplain() {
  const out = $('#ex-out'); out.innerHTML = '<p class="hint">Analysing…</p>';
  try {
    const r = await api(`/api/explain?start=${$('#ex-s').value}&end=${$('#ex-e').value}&freq=${state.freq}&target=${state.exTarget}`);
    const items = r.drivers.map(d => ({ label: d.label + (d.significant ? '' : ' (n.s.)'), v: d.contribution_pp }));
    items.push({ label: 'Baseline drift', v: r.drift_pp }, { label: 'Unexplained', v: r.unexplained_pp });
    items.sort((a, b) => Math.abs(a.v) - Math.abs(b.v));
    const total = r.log_change_pp;
    const rc = r.regime_comparison;
    const isFx = r.target === 'USDZMW';
    const unitChg = isFx ? '%' : 'pp';
    out.innerHTML = `<div class="two"><div class="card"><h2>${sgn(r.change_pct, isFx ? 1 : 2)}${unitChg} &nbsp;<span class="sub">${esc(r.target_label)} ${fmt(r.level_start)} → ${fmt(r.level_end)} · ${r.start} to ${r.end}</span></h2>
        <ul class="story">${r.narrative.map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>
      <div class="card"><h2>Driver Contributions (pp)</h2><p class="hint">Contributions sum to the total move (${sgn(total)}pp). Red = upward push, blue = downward push.</p>
        <div class="legend"><span><i style="background:var(--weak)"></i>${isFx ? 'Pushed USD/ZMW up (weaker kwacha)' : 'Lifted rate / inflation'}</span><span><i style="background:var(--strong)"></i>${isFx ? 'Pushed it down (stronger kwacha)' : 'Lowered rate / inflation'}</span></div>
        <div id="ex-bars" class="chart short"></div></div></div>
      <div class="two">${r.interpretation_guide ? `<div class="card"><h2>How to Interpret Attribution Results</h2><ul class="story">${r.interpretation_guide.map(g => `<li>${esc(g)}</li>`).join('')}</ul></div>` : ''}

async function runForecast() {
  const out = $('#fc-out');
  try {
    const f = await api(`/api/forecast?h=${state.fcH}&model=${state.fcModel}&freq=${state.freq}&target=${state.fcTarget}`);
    const lookDays = f.freq === 'W-FRI' ? 365 : 730;
    const hist = await api(`/api/series?ids=${f.target}&start=${new Date(new Date(f.last_date).getTime() - lookDays * 864e5).toISOString().slice(0, 10)}`);
    const hs = hist[f.target];
    const P = f.path, d = P.map(p => p.date);
    const rgba = (v, a) => { const c = css(v); return c.startsWith('#') ? `rgba(${parseInt(c.slice(1, 3), 16)},${parseInt(c.slice(3, 5), 16)},${parseInt(c.slice(5, 7), 16)},${a})` : c; };
    const band = (lo, hi, a, name) => [{ x: d, y: P.map(p => p[lo]), mode: 'lines', line: { width: 0 }, hoverinfo: 'skip', showlegend: false },
      { x: d, y: P.map(p => p[hi]), mode: 'lines', line: { width: 0 }, fill: 'tonexty', fillcolor: rgba('--s1', a), name, hoverinfo: 'skip' }];
    const tr = [{ x: hs.dates, y: hs.values, mode: 'lines', line: { color: css('--s1'), width: 2 }, name: f.target_label, hovertemplate: '%{y:.3f}' },
      ...band('q005', 'q995', .08, '99% tail'), ...band('q025', 'q975', .16, '95% risk'), ...band('q25', 'q75', .30, '50% core'),
      { x: [f.last_date].concat(d), y: [f.last_level].concat(P.map(p => p.mid)), mode: 'lines', line: { color: css('--s1'), width: 2, dash: 'dash' }, name: 'Median', hovertemplate: '%{y:.3f}' }];
    const L = P.at(-1);
    const sel = f.backtest_summary.filter(r => r.model === f.model);
    const sk = sel.length ? sel.reduce((a, r) => a + (r.skill_vs_rw || 0), 0) / sel.length : 0;
    const u = f.freq === 'W-FRI' ? 'w' : 'm';
    const chgU = f.target_kind === 'price' ? '%' : 'pp';
    const verdict = f.model === 'rw' || sk <= 0.005
      ? `<b>Benchmark Verdict:</b> Centre holds near spot while empirical quantile bands carry the treasury risk range.`
      : `<b>Benchmark Verdict:</b> ${(sk * 100).toFixed(1)}% lower out-of-sample MAE than random walk in rolling backtests.`;
    out.innerHTML = `<div class="legend"><span><i style="background:var(--s1)"></i>History &amp; median</span><span><i style="background:${rgba('--s1', .30)}"></i>50% core</span><span><i style="background:${rgba('--s1', .16)}"></i>95% risk band</span><span><i style="background:${rgba('--s1', .08)}"></i>99% tail stress</span></div>
      <div id="fc-chart" class="chart"></div>
      <div class="verdict">${verdict}<br><span class="sub">Active model: <b>${esc(f.model)}</b> · ${esc(f.model_reason)}</span></div>
      <div class="grid"><div class="stat"><div class="n">Latest (${f.last_date})</div><div class="v">${fmt(f.last_level)}</div></div>
        <div class="stat"><div class="n">Median (${f.horizon}${u})</div><div class="v">${fmt(L.mid)}</div><div class="d">${sgn(L.change_pct)}${chgU} · 50% core ${fmt(L.q25)}–${fmt(L.q75)}</div></div>
        <div class="stat"><div class="n">95% Risk Band</div><div class="v" style="font-size:20px">${fmt(L.q025)} – ${fmt(L.q975)}</div></div>
        <div class="stat"><div class="n">99% Tail Stress Band</div><div class="v" style="font-size:20px">${fmt(L.q005)} – ${fmt(L.q995)}</div></div></div>
      ${f.interpretation ? `<div class="verdict"><b>How to Interpret:</b> ${esc(f.interpretation.calibration_status)} · ${esc(f.interpretation.band_skew_label)}<ul class="story" style="margin-top:6px">${f.interpretation.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul></div>` : ''}
      ${f.drivers.length ? `<h2>Driver Momentum Inputs (${f.horizon}${u}, ${f.lookback_periods}-period lookback)</h2><table><tr><th>Input</th><th class="num">Recent move</th><th class="num">Pull on ${esc(f.target_label)}</th></tr>${f.drivers.map(x => `<tr><td>${esc(x.label)}</td><td class="num">${sgn(x.recent_move)}${x.unit}</td><td class="num">${sgn(x.pull_pct, 2)}${chgU}</td></tr>`).join('')}</table>` : ''}
      <h2 style="margin-top:16px">Rolling-Origin Backtest Calibration</h2>
      <p class="hint">95% cover should track ~95% and 99% cover should track ~98%–99% out-of-sample.</p>
      <table><tr><th>Horizon</th><th>Model</th><th class="num">MAE</th><th class="num">Skill vs RW</th><th class="num">DM t-stat</th><th class="num">Dir hit</th><th class="num">95% cover</th><th class="num">99% cover</th><th class="num">50% cover</th><th class="num">Origins</th></tr>
      ${f.backtest_summary.sort((a, b) => a.h - b.h || ['rw', 'driver', 'blend'].indexOf(a.model) - ['rw', 'driver', 'blend'].indexOf(b.model)).map(r => `<tr><td>${r.h}${u}</td><td>${r.model}</td><td class="num">${fmt(r.mae_pct)}${chgU}</td><td class="num">${r.model === 'rw' ? '–' : sgn(r.skill_vs_rw * 100, 1) + '%'}</td><td class="num">${r.dm_t == null ? '–' : fmt(r.dm_t, 1)}</td><td class="num">${r.direction_hit == null ? '–' : (r.direction_hit * 100).toFixed(0) + '%'}</td><td class="num">${(r.coverage95 * 100).toFixed(1)}%</td><td class="num">${(r.coverage99 * 100).toFixed(1)}%</td><td class="num">${(r.coverage50 * 100).toFixed(0)}%</td><td class="num">${r.n}</td></tr>`).join('')}</table>`;
    Plotly.react('fc-chart', tr, layout({ yaxis: { gridcolor: css('--grid'), linecolor: css('--axis'), title: f.target_unit || f.target_label, zeroline: false } }), cfg);
  } catch (e) { showErr(out, e); }
}

        <label><input type="checkbox" id="up-r"> replace</label><button class="btn primary" id="up-go" ${locked ? 'disabled' : ''}>Upload</button></div><div id="up-msg" class="sub"></div></div>
      <div class="card"><h2>Data inventory &amp; provenance</h2>${rfLine}<table><tr><th>Series</th><th>Source</th><th class="num">Rows</th><th>From</th><th>To</th><th class="num">Age</th><th>Status</th></tr>
      ${s.series.map(x => `<tr><td>${esc(x.name)}<br><span class="sub">${esc(x.series_id)} · ${esc(x.unit)}</span></td><td>${esc(x.source)}</td><td class="num">${x.n_obs}</td><td>${x.first_date}</td><td>${x.last_date}</td><td class="num">${x.age_days}d</td><td>${x.is_demo ? 'DEMO' : x.stale ? 'stale' : 'ok'}</td></tr>`).join('')}</table></div>
      ${m ? `<div class="card"><h2>Model inputs (R² ${fmt(m.r2)}, n=${m.n})</h2><table><tr><th>Driver</th><th>Series</th><th class="num">β</th><th class="num">Std err</th><th class="num">p-value</th></tr>
        ${m.drivers.map(d => `<tr><td>${esc(d.label)}</td><td>${esc(d.series)}</td><td class="num">${fmt(d.beta, 3)}</td><td class="num">${fmt(d.se, 3)}</td><td class="num">${fmt(d.p_value, 3)}${d.p_value < 0.01 ? ' **' : d.p_value < 0.05 ? ' *' : ''}</td></tr>`).join('')}</table></div>` : ''}`;
    $('#rf-go').onclick = async () => { $('#rf-msg').textContent = 'Starting…'; await api('/api/refresh', { method: 'POST' }); setTimeout(() => location.reload(), 20000); };
    if ($('#demo-go')) $('#demo-go').onclick = async () => { await api('/api/demo', { method: 'POST' }); location.reload(); };
    $('#up-go').onclick = async () => {
      const f = $('#up-f').files[0]; if (!f) return;
      const q = new URLSearchParams({ series_id: $('#up-s').value, filename: f.name, replace: $('#up-r').checked });
      if ($('#up-c').value.trim()) q.set('value_col', $('#up-c').value.trim());
      await api('/api/upload?' + q, { method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: await f.arrayBuffer() });
      location.reload();
    };
  } catch (e) { showErr(el, e); }
}
